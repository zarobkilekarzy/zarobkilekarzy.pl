name: Deploy to Cloudflare Pages

# Po aktywacji historii push tylko waliduje. Publikacja i deploy wymagają ręcznego uruchomienia.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wydaj_historie:
        description: 'Wydać kandydatów zatwierdzonych przez moderatorów?'
        type: boolean
        default: false
      wydanie_id:
        description: 'UUID wcześniejszego wydania (przy ręcznej powtórce); puste = nowe wydanie'
        type: string
        default: ''

permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  issue:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.HISTORIE_AKTYWNE == 'true' && inputs.wydaj_historie
    runs-on: ubuntu-latest
    environment: historie-wydanie
    outputs:
      release_id: ${{ steps.issue.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Ręczne wydanie projekcji (bez tokenu D1)
        id: issue
        env:
          HISTORIE_RELEASE_KEY: ${{ secrets.HISTORIE_RELEASE_KEY }}
          HISTORIE_RELEASE_ID: ${{ inputs.wydanie_id }}
        run: node tools/historie/release-workflow.mjs

  build:
    needs: [validate, issue]
    if: always() && needs.validate.result == 'success' && (needs.issue.result == 'success' || needs.issue.result == 'skipped')
    runs-on: ubuntu-latest
    # Żadnych sekretów ani uprawnień do D1 w tym jobie.
    env:
      HISTORIE_AKTYWNE: ${{ vars.HISTORIE_AKTYWNE }}
      HISTORIE_PUBLIKACJE_URL: ${{ vars.HISTORIE_PUBLIKACJE_URL }}
      HISTORIE_OCZEKIWANE_WYDANIE: ${{ needs.issue.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Potwierdź publiczne wydanie przed buildem
        run: node tools/historie/check-feed.mjs capture
      - run: npm run build
      - run: node tools/historie/check-feed.mjs stamp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pages-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && (vars.HISTORIE_AKTYWNE != 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    env:
      HISTORIE_AKTYWNE: ${{ vars.HISTORIE_AKTYWNE }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pages-dist
          path: dist/
      # Projekt, KV i D1 provisionujemy poza CI. Token deployu nie potrzebuje D1:Edit.
      - name: Zatrzymaj deploy po zmianie lub wycofaniu historii
        run: node tools/historie/check-feed.mjs check
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zarobkilekarzy --branch=main --commit-dirty=true
