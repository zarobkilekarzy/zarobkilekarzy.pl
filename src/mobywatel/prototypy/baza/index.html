<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<script src="i18n.js?v=6"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f3f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>mObywatel</title>
<link rel="icon" href="assets/icon-mobywatel.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=22">
</head>
<body>
<div class="phone" id="app">
  <div class="island"></div>
  <div class="status"><span id="clock">20:10</span><span class="sig"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx=".8"/><rect x="4.6" y="4.8" width="3" height="6.2" rx=".8"/><rect x="9.2" y="2.4" width="3" height="8.6" rx=".8"/><rect x="13.8" y="0" width="3" height="11" rx=".8"/></svg><svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2A10.3 10.3 0 0 0 8 .5 10.3 10.3 0 0 0 .9 3.4L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.1-1.2A6.9 6.9 0 0 0 8 3.9a6.9 6.9 0 0 0-4.7 1.9L4.4 7A5.2 5.2 0 0 1 8 5.6Zm0 3.3a1.6 1.6 0 0 1 1.2.5L8 10.6 6.8 9.4A1.6 1.6 0 0 1 8 8.9Z"/></svg><i class="bat"></i></span></div>

  <header class="top" id="top">
    <button class="home" id="homeBtn" aria-label="Ekran główny"><img class="emblem" src="assets/icon-mobywatel.svg" alt=""></button>
    <span class="sp"></span>
    <button class="ico chatonly" id="histBtn" aria-label="Historia rozmów" aria-haspopup="true" aria-expanded="false" aria-controls="hmenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 12a7.8 7.8 0 1 0 2.3-5.5"/><path d="M4 4.6v3.6h3.6"/><path d="M12 8.2V12l2.7 1.7"/></svg><span class="hc" id="histCount" hidden></span></button>
    <button class="ico chatonly" id="newBtn" aria-label="Nowa rozmowa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 4.5h-5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5"/><path d="M17.7 3.8a1.9 1.9 0 0 1 2.7 2.7l-7.6 7.6-3.4.7.7-3.4z"/></svg></button>
    <button class="ico" id="qrBtn" aria-label="Potwierdź swoje dane: zeskanuj znak mObywatela odbiorcy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8V6a2.5 2.5 0 0 1 2.5-2.5h2M16 3.5h2A2.5 2.5 0 0 1 20.5 6v2M20.5 16v2a2.5 2.5 0 0 1-2.5 2.5h-2M8 20.5H6A2.5 2.5 0 0 1 3.5 18v-2"/><path d="M8 10h7.5l-2.2-2.2M16 14H8.5l2.2 2.2"/></svg></button>
    <button class="ico" id="mailBtn" aria-label="Skrzynka, 1 nowa wiadomość"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m4.5 7.5 7.5 5.5 7.5-5.5"/></svg><span class="dot"></span></button>
    <button class="ico" id="bellBtn" aria-label="Powiadomienia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 1.5H5zM10 20.5a2 2 0 0 0 4 0"/></svg></button>
  </header>

  <button class="title" id="title" aria-haspopup="true" aria-expanded="false" aria-controls="lmenu">Dokumenty<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></svg></button>
  <div class="lmenu" id="lmenu"><div class="scrim"></div><div class="panel" role="menu" aria-label="Układ dokumentów i osoba"><div class="mh">Układ dokumentów</div><div class="ml"></div><div class="mh">Osoba w pokazie</div><div class="mo"></div></div></div>

  <div class="hmenu" id="hmenu"><div class="scrim"></div><div class="panel" role="dialog" aria-label="Historia rozmów"><div class="hh"><span>Rozmowy</span><button id="hnew" type="button">+ Nowa rozmowa</button></div><div class="hl" id="hlist" data-t="0"></div></div></div>

  <div class="stackwrap" id="stackwrap"><div class="stack" id="stack"></div></div>
  <div class="alt" id="alt"></div>

  <section class="reminders" id="reminders" aria-label="Przypomnienia">
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="chat" id="chat" aria-live="polite">
    <div class="msgs" id="msgs"></div>
  </section>

  <section class="voice" id="voice" aria-label="Rozmowa głosowa" data-vs="idle">
    <div class="vstage" id="vstage"></div>
    <div class="vfoot">
      <p class="vheard" id="vheard"></p>
      <p class="vstate" id="vstate">Dotknij, aby mówić</p>
      <button type="button" class="vmic" id="vmic" aria-label="Mów"><span class="ring"></span><span class="ring r2"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg></button>
      <button type="button" class="vkbd" id="vkbd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.3 10h.01M12.6 10h.01M15.9 10h.01M18 10h.01M6 13.5h.01M18 13.5h.01M9 14h6"/></svg>Pisz zamiast mówić</button>
    </div>
  </section>

  <form class="composer" id="composer" autocomplete="off">
    <div class="bar">
      <button type="button" class="ib" id="cam" aria-label="Zrób zdjęcie dokumentu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h3l1.8-2.5h6.4L17 8.5h3V19H4z"/><circle cx="12" cy="13.5" r="3.4"/></svg></button>
      <input id="prompt" placeholder="Co chcesz załatwić?" enterkeyhint="send" aria-label="Wiadomość">
      <button type="button" class="ib mic" id="mic" aria-label="Powiedz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg></button>
      <button type="submit" class="send" aria-label="Wyślij"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18.5v-13M6.5 11 12 5.5l5.5 5.5"/></svg></button>
    </div>
  </form>

  <div class="todo" id="todo" aria-hidden="true"><div class="scrim"></div>
    <div class="tpanel" role="dialog" aria-modal="true" aria-labelledby="todoH">
      <div class="grab"></div>
      <div class="th"><h2 id="todoH">Do załatwienia</h2><button class="tx-close" id="todoClose" aria-label="Zamknij"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
      <div class="tl"></div>
      <button class="task" id="todoAsk">Zapytaj asystenta o wszystkie sprawy</button>
    </div>
  </div>
  <div class="sheet" id="detail" role="dialog" aria-modal="true"></div>
  <div class="auth" id="faceid" aria-hidden="true"><div class="box">
    <svg class="face" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 15V10a4 4 0 0 1 4-4h5M33 6h5a4 4 0 0 1 4 4v5M42 33v5a4 4 0 0 1-4 4h-5M15 42h-5a4 4 0 0 1-4-4v-5M17 18v3M31 18v3M24 18v8h-2M18 32s2.4 2.6 6 2.6 6-2.6 6-2.6"/></svg>
    <svg class="ok" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="18"/><path d="m16 24.5 5.5 5.5L32 19"/></svg>
    <span>Face ID</span>
  </div></div>
  <div class="homebar"></div>
</div>
<script src="osoby.js?v=21"></script>
<script src="sylwetki.js?v=19"></script>
<script src="core.js?v=21"></script>
<script src="variants.js?v=20"></script>
<script src="scenarios.js?v=22"></script>
<script src="agent.js?v=25"></script>
<script src="znak-kod.js?v=19"></script>
<script src="znak.js?v=21"></script>
</body>
</html>
