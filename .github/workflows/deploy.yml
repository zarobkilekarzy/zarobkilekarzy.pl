name: Deploy to Cloudflare Workers

# Deploy: automatycznie po pushu na `main` oraz ręcznie (Actions → Run workflow) — tylko z `main`.
# Worker nie ma adresów podglądu (wrangler.jsonc: preview_urls false), więc każdy deploy jest
# produkcyjny; ręczny run z innej gałęzi kończy się na buildzie, bez wdrożenia.
# Codziennie o 1:00 UTC (3:00 latem, 2:00 zimą w Polsce) przebudowa `main`: statystyki wyników
# na /egzamin/ czyta z D1 build (src/lib/egzamin/site-stats.ts), więc strona ich nie odpytuje.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Cała historia: kalendarz zmian na /o-projekcie/ liczy commity z `git log` (src/lib/historia.ts)
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # `tsconfig.json` dziedziczy po `astro/tsconfigs/strict`, ale typecheck nigdy nie
        # był uruchamiany — narosło 234 błędów. Wyzerowane 30.08.2026, więc trzymamy
        # TWARDĄ bramkę: każdy nowy błąd typu wywraca deploy. Świadomie bez
        # `continue-on-error` — krok, który zawsze jest zielony, nie jest zabezpieczeniem.
        run: npm run check

      - name: Build
        # Tryb wydania (SEO_STRICT=1): błędy audytu SEO i stare adresy bez przekierowania
        # przerywają build.
        # Token Cloudflare Web Analytics jest publiczny (trafia do HTML jako data-cf-beacon);
        # bez niego Analytics.astro nie renderuje beaconu i pomiar znika.
        # Token API: odczyt statystyk /egzamin/ z D1 (wrangler d1 execute); bez dostępu sekcja znika.
        env:
          CF_WEB_ANALYTICS_TOKEN: 41998160098a4fd3965151cf1b67f440
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run build:release

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
