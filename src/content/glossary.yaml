# Słownik pojęć — jedno źródło dla /slownik/, modułu „Słowniczek” na stronie głównej i wyszukiwarki.
#
# Pola (schemat: src/content.config.ts):
#   id       kotwica hasła na /slownik/#<id>; nie zmieniaj po publikacji (stare adresy /slownik/#kontrakt itd.)
#   term     hasło; strona sortuje hasła alfabetycznie po tym polu
#   full     rozwinięcie skrótu albo krótkie dookreślenie
#   def      definicja: 1–3 zdania, prosty język, bez ocen i bez liczb, które się starzeją
#            (kwoty i stawki zostają w tekstach, do których prowadzi `more`)
#   more     „Więcej”: { ref: id artykułu, anchor?: kotwica sekcji, label?: krótszy tytuł }
#            albo { href, label } dla stron spoza kolekcji artykułów
#   sources  podstawa prawna albo źródło: { label, href }
#   home     opcjonalnie: pozycja w module na stronie głównej (6–8 haseł); bez pola = tylko /slownik/
#   tab      opcjonalnie: krótsza etykieta zakładki w module na stronie głównej (domyślnie term)
#
# Weryfikacja treści: 16.10.2026 (stan prawny i źródła — raport redakcji do hasła).

- id: aotmit
  term: AOTMiT
  full: Agencja Oceny Technologii Medycznych i Taryfikacji
  def: >-
    AOTMiT to państwowa agencja nadzorowana przez ministra zdrowia. Ustala taryfy świadczeń, które po zatwierdzeniu
    przez ministra NFZ przenosi do swoich zarządzeń, wydaje rekomendacje dotyczące ich finansowania i zbiera od placówek
    dane o wynagrodzeniach.
  more:
    - ref: wycena-swiadczen
    - ref: rozklad-wynagrodzen
  sources:
    - label: Ustawa o świadczeniach opieki zdrowotnej finansowanych ze środków publicznych (t.j. Dz.U. 2025 poz. 1461), art. 31lb, 31lc, 31m i 31n
      href: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf

- id: dyzur-medyczny
  term: Dyżur medyczny
  full: praca w szpitalu poza normalnymi godzinami
  def: >-
    Dyżur medyczny to praca lekarza lub innego pracownika medycznego szpitala poza normalnymi godzinami pracy, na miejscu
    w placówce. Wlicza się do czasu pracy, a płaci się za niego jak za nadgodziny, z dodatkiem 50% albo 100% stawki
    (w nocy, w niedziele i święta). To inne pojęcie niż gotowość „pod telefonem”.
  more:
    - ref: rozklad-wynagrodzen
    - ref: wieloetatowosc
  sources:
    - label: Ustawa o działalności leczniczej (t.j. Dz.U. 2026 poz. 156), art. 95
      href: https://api.sejm.gov.pl/eli/acts/DU/2026/156/text.pdf
    - label: Kodeks pracy (t.j. Dz.U. 2025 poz. 277), art. 151¹ § 1–3
      href: https://api.sejm.gov.pl/eli/acts/DU/2025/277/text.pdf

- id: etat
  term: Etat
  full: umowa o pracę
  def: >-
    Etat to umowa o pracę według Kodeksu pracy, a w placówkach leczniczych także ustawy o działalności leczniczej.
    Ustawa wyznacza najniższą płacę zasadniczą dla danego zawodu medycznego, a faktyczna pensja może być wyższa.
    Czas pracy ma limity: norma to przeciętnie 37 godzin 55 minut tygodniowo, a za pisemną zgodą pracownika szpitala
    więcej (opt-out).
  more:
    - ref: kontrakt-vs-etat
    - ref: rozklad-wynagrodzen
  sources:
    - label: Ustawa z 8 czerwca 2017 r. o sposobie ustalania najniższego wynagrodzenia zasadniczego niektórych pracowników zatrudnionych w podmiotach leczniczych, art. 3
      href: https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20170001473
    - label: Ustawa o działalności leczniczej (t.j. Dz.U. 2026 poz. 156), art. 93 i 96
      href: https://api.sejm.gov.pl/eli/acts/DU/2026/156/text.pdf

- id: gotowosc
  term: Gotowość
  full: dyżur „pod telefonem”
  home: 5
  def: >-
    Gotowość to czas, w którym pracownik szpitala musi być do dyspozycji i stawić się na wezwanie; potocznie mówi się
    o dyżurze „pod telefonem”. Za każdą godzinę gotowości dostaje połowę godzinowej stawki wynagrodzenia zasadniczego,
    a po wezwaniu jego praca rozlicza się jak dyżur medyczny.
  more:
    - ref: wieloetatowosc
      anchor: gotowosc-pod-telefonem
  sources:
    - label: Ustawa o działalności leczniczej (t.j. Dz.U. 2026 poz. 156), art. 98
      href: https://api.sejm.gov.pl/eli/acts/DU/2026/156/text.pdf

- id: ikp
  term: IKP
  full: Internetowe Konto Pacjenta
  home: 6
  def: >-
    Internetowe Konto Pacjenta (IKP) na pacjent.gov.pl pokazuje po zalogowaniu m.in. e-recepty, e-skierowania
    i świadczenia, które placówki rozliczyły z NFZ na Twój numer PESEL. Pozwala sprawdzić, czy wizyty wpisane
    w rozliczeniach rzeczywiście się odbyły.
  more:
    - ref: fikcyjne-wizyty
  sources:
    - label: pacjent.gov.pl, Internetowe Konto Pacjenta
      href: https://pacjent.gov.pl/internetowe-konto-pacjenta

- id: jgp
  term: JGP
  full: Jednorodne Grupy Pacjentów
  def: >-
    JGP to system, w którym NFZ przypisuje każdy pobyt w szpitalu do grupy na podstawie rozpoznań i wykonanych procedur.
    Każda grupa ma wartość w punktach, od której zależy, ile szpital rozlicza za pobyt.
  more:
    - ref: rozliczenia-nfz
      anchor: punkty-jgp-o-zaplacie-decyduje-opis-pobytu
    - ref: wycena-swiadczen
  sources:
    - label: NFZ, Jednorodne Grupy Pacjentów — materiały dla świadczeniodawców
      href: https://www.nfz.gov.pl/dla-swiadczeniodawcy/jednorodne-grupy-pacjentow/

- id: kapitacja
  term: Kapitacja
  full: stawka za pacjenta na liście lekarza POZ
  home: 7
  def: >-
    Kapitacja to sposób płacenia w podstawowej opiece zdrowotnej (POZ): NFZ płaci stałą roczną stawkę za każdego pacjenta
    zapisanego na listę lekarza, niezależnie od liczby wizyt. Stawkę mnoży się przez współczynnik zależny od wieku
    pacjenta. Poza kapitacją POZ dostaje osobne płatności, np. za opiekę koordynowaną.
  more:
    - ref: poz-pieniadz-za-pacjenta
  sources:
    - label: Zarządzenie Prezesa NFZ nr 65/2026/DSOZ z 14 lipca 2026 r. (stawki kapitacyjne w POZ)
      href: https://baw.nfz.gov.pl/NFZ/document/43917/Zarzadzenie-65_2026_DSOZ

- id: komin-placowy
  term: Komin płacowy
  full: ustawa kominowa
  def: >-
    Komin płacowy to zarobek jednej osoby wyraźnie wyższy niż płace pozostałych. Tak zwana ustawa kominowa ogranicza
    pensję kierownika samodzielnego publicznego szpitala do sześciokrotności przeciętnego wynagrodzenia, ale nie obejmuje
    lekarzy na kontraktach.
  more:
    - ref: komin-placowy
  sources:
    - label: Ustawa z 3 marca 2000 r. o wynagradzaniu osób kierujących niektórymi podmiotami prawnymi (t.j. Dz.U. 2019 poz. 2136), art. 8 pkt 10
      href: https://api.sejm.gov.pl/eli/acts/DU/2019/2136/text.pdf

- id: kontrakt
  term: Kontrakt
  full: umowa cywilnoprawna (B2B lub zlecenie)
  home: 2
  def: >-
    Kontrakt to umowa cywilnoprawna, a nie umowa o pracę: lekarz prowadzi działalność gospodarczą (B2B) i wystawia
    placówce faktury albo pracuje na umowie zlecenia. Stawkę ustalają strony, a limity czasu pracy pracowników
    go nie obejmują. Łącznej kwoty z kontraktów jednej osoby w kilku placówkach nikt nie publikuje.
  more:
    - ref: kontrakt-vs-etat
    - ref: wieloetatowosc
  sources:
    - label: Ustawa o działalności leczniczej (t.j. Dz.U. 2026 poz. 156), art. 26 i 27 (umowy o udzielanie świadczeń)
      href: https://api.sejm.gov.pl/eli/acts/DU/2026/156/text.pdf

- id: liczba-lekarzy
  term: Liczba lekarzy
  full: z prawem wykonywania zawodu, wykonujący zawód, pracujący z pacjentem
  def: >-
    Lekarzy liczy się na trzy sposoby: wszyscy z prawem wykonywania zawodu (także niepracujący w zawodzie), ci, którzy
    według rejestru izby lekarskiej zawód wykonują, i ci, którzy według GUS pracują bezpośrednio z pacjentem. Te liczby
    różnią się definicją i terminem, więc nie łączymy ich w jednym rachunku.
  more:
    - ref: dlaczego-brakuje-lekarzy
    - ref: symulator-podazy-lekarzy
  sources:
    - label: Ustawa o izbach lekarskich (t.j. Dz.U. 2021 poz. 1342), art. 49 ust. 1 (rejestr lekarzy wykonujących i niewykonujących zawodu)
      href: https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20210001342
    - label: Naczelna Izba Lekarska, Centralny Rejestr Lekarzy — informacje statystyczne
      href: https://nil.org.pl/rejestry/centralny-rejestr-lekarzy/informacje-statystyczne

- id: nadwykonania
  term: Nadwykonania
  full: świadczenia ponad plan umowy z NFZ
  home: 4
  def: >-
    Nadwykonania to świadczenia wykonane ponad plan lub limit z umowy placówki z NFZ. Fundusz nie zawsze płaci za nie
    w całości: płaci m.in. za ratowanie życia w stanie nagłym, a w sieci szpitali nadwykonania liczą się tylko częściowo
    przy ustalaniu kolejnego ryczałtu.
  more:
    - ref: rozliczenia-nfz
      anchor: nadwykonania-praca-ponad-plan
  sources:
    - label: NFZ, NFZ rozlicza nadwykonania w świadczeniach nielimitowanych (20.04.2026)
      href: https://www.nfz.gov.pl/aktualnosci/aktualnosci-centrali/nfz-rozlicza-nadwykonania-w-swiadczeniach-nielimitowanych,8926.html
    - label: Uchwała 7 sędziów SN z 19 marca 2019 r., III CZP 80/18 (omówienie Rzeczpospolitej)
      href: https://www.rp.pl/ochrona-zdrowia/art1427731-sad-najwyzszy-w-sprawie-zasad-placenia-za-nadwykonania-ratujace-zycie-w-stanach-naglych

- id: nfz
  term: NFZ
  full: Narodowy Fundusz Zdrowia
  def: >-
    Narodowy Fundusz Zdrowia to państwowy płatnik, który zawiera umowy z placówkami i płaci im za leczenie pacjentów.
    Składkę zdrowotną pobierają ZUS i KRUS, a następnie przekazują ją Funduszowi; do składki dochodzą m.in. dotacje
    z budżetu państwa.
  more:
    - ref: budzet-nfz
    - ref: sladem-zlotowki
  sources:
    - label: Ustawa o świadczeniach opieki zdrowotnej finansowanych ze środków publicznych (t.j. Dz.U. 2025 poz. 1461), art. 87–91, 96, 97 i 116
      href: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf

- id: nil-crl
  term: NIL i CRL
  full: Naczelna Izba Lekarska i Centralny Rejestr Lekarzy
  def: >-
    Naczelna Izba Lekarska (NIL) to samorząd zawodowy lekarzy i lekarzy dentystów. Prowadzi Centralny Rejestr Lekarzy,
    czyli bazę osób z prawem wykonywania zawodu; z jego zestawień pochodzą nasze liczby o kadrze.
  more:
    - ref: dlaczego-brakuje-lekarzy
  sources:
    - label: Ustawa o izbach lekarskich (t.j. Dz.U. 2021 poz. 1342), art. 49–50
      href: https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20210001342
    - label: Naczelna Izba Lekarska, Centralny Rejestr Lekarzy — informacje statystyczne
      href: https://nil.org.pl/rejestry/centralny-rejestr-lekarzy/informacje-statystyczne

- id: opt-out
  term: Opt-out
  full: zgoda na dłuższy czas pracy
  def: >-
    Opt-out to pisemna zgoda pracownika medycznego szpitala na pracę przeciętnie dłuższą niż 48 godzin tygodniowo
    w okresie rozliczeniowym (do 4 miesięcy). W praktyce górną granicą jest ok. 78 godzin tygodniowo, bo pracownik musi
    mieć zapewniony odpoczynek. Dotyczy umów o pracę, a przepis ma wygasnąć 1 stycznia 2028 r.
  more:
    - ref: wieloetatowosc
      anchor: przepis-ktory-na-to-pozwala-i-jego-data-waznosci
    - ref: kontrakt-vs-etat
  sources:
    - label: Ustawa o działalności leczniczej (t.j. Dz.U. 2026 poz. 156), art. 96 i 97
      href: https://api.sejm.gov.pl/eli/acts/DU/2026/156/text.pdf

- id: pseudonimizacja
  term: Pseudonimizacja
  full: stały identyfikator zamiast nazwiska
  tab: Pseudonim
  home: 8
  def: >-
    Pseudonimizacja to zastąpienie nazwiska stałym kodem. Ta sama osoba ma zawsze ten sam kod, więc jej wypłaty z wielu
    placówek można zsumować, ale bez dodatkowego klucza nie wiadomo, kim jest. To nie anonimizacja: takie dane nadal są
    danymi osobowymi.
  more:
    - href: /postulat/
      label: 'Postulat: jawne kwoty, chronione nazwiska'
  sources:
    - label: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2016/679 (RODO), art. 4 pkt 5
      href: https://eur-lex.europa.eu/legal-content/PL/TXT/?uri=CELEX:32016R0679

- id: pwz
  term: PWZ
  full: prawo wykonywania zawodu
  home: 1
  def: >-
    Prawo wykonywania zawodu (PWZ) to uprawnienie do leczenia, które lekarzowi przyznaje okręgowa rada lekarska; ma ono
    unikalny siedmiocyfrowy numer, widoczny w rejestrze lekarzy. Od 5 sierpnia 2026 r. minister zdrowia może żądać
    od placówek danych o wynagrodzeniach oznaczonych numerem PESEL i numerem PWZ, a nasz postulat to publikacja łącznych
    wypłat każdej osoby pod stałym identyfikatorem, bez nazwisk.
  more:
    - ref: ustawa-o-danych-a-jawny-rejestr
    - href: /postulat/
      label: 'Postulat: jawne kwoty, chronione nazwiska'
  sources:
    - label: Ustawa o zawodach lekarza i lekarza dentysty (t.j. Dz.U. 2026 poz. 37), art. 5
      href: https://api.sejm.gov.pl/eli/acts/DU/2026/37/text.pdf
    - label: Naczelna Izba Lekarska, Zasady weryfikowania numeru prawa wykonywania zawodu
      href: https://nil.org.pl/rejestry/centralny-rejestr-lekarzy/zasady-weryfikowania-nr-prawa-wykonywania-zawodu
    - label: Ustawa z 19 czerwca 2026 r. (Dz.U. 2026 poz. 972), nowe brzmienie art. 27a ustawy o działalności leczniczej
      href: https://api.sejm.gov.pl/eli/acts/DU/2026/972/text.pdf

- id: rezydentura
  term: Rezydentura
  full: tryb szkolenia specjalizacyjnego
  home: 3
  def: >-
    Rezydentura to tryb szkolenia specjalizacyjnego, w którym lekarz pracuje na umowę o pracę w placówce prowadzącej
    szkolenie. Pensję zasadniczą finansuje z budżetu państwa minister zdrowia, a wypłaca ją placówka. Jej wysokość
    określa rozporządzenie i zależy od dziedziny oraz od tego, czy lekarz jest w pierwszych dwóch latach szkolenia.
  more:
    - ref: wedlug-specjalizacji
  sources:
    - label: Ustawa o zawodach lekarza i lekarza dentysty (t.j. Dz.U. 2026 poz. 37), art. 16h i 16j
      href: https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20260000037
    - label: Rozporządzenie Ministra Zdrowia z 25 czerwca 2026 r. w sprawie wynagrodzenia rezydentów (Dz.U. 2026 poz. 856)
      href: https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20260000856

- id: ryczalt
  term: Ryczałt
  full: kwota dla szpitala z sieci za okres rozliczeniowy
  def: >-
    Ryczałt to kwota, którą NFZ płaci szpitalowi z sieci szpitali za cały okres rozliczeniowy, zamiast płacić osobno
    za każdy pobyt. Jej wysokość zależy m.in. od tego, ile i jakich świadczeń szpital sprawozdał w poprzednim okresie.
  more:
    - ref: rozliczenia-nfz
      anchor: ryczalt-kwota-z-gory-za-caly-okres
  sources:
    - label: Ustawa o świadczeniach opieki zdrowotnej finansowanych ze środków publicznych (t.j. Dz.U. 2025 poz. 1461), art. 136c
      href: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf

- id: siec-szpitali
  term: Sieć szpitali
  full: system podstawowego szpitalnego zabezpieczenia (PSZ)
  def: >-
    Sieć szpitali, czyli system podstawowego szpitalnego zabezpieczenia, to grupa szpitali zakwalifikowanych na cztery
    lata do stałego finansowania ryczałtem. Obejmuje m.in. leczenie szpitalne, poradnie przyszpitalne i rehabilitację.
  more:
    - ref: rozliczenia-nfz
  sources:
    - label: Ustawa o świadczeniach opieki zdrowotnej finansowanych ze środków publicznych (t.j. Dz.U. 2025 poz. 1461), art. 95l, 95m, 136c i 159a
      href: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf

- id: wieloetatowosc
  term: Wieloetatowość
  full: praca w kilku placówkach naraz
  def: >-
    Wieloetatowość to praca jednej osoby jednocześnie w kilku placówkach: na etacie, kontrakcie albo umowie zlecenia.
    Każda placówka zna tylko swoją część godzin i wypłat. Od sierpnia 2026 r. minister zdrowia może zebrać dane,
    z których da się je zsumować, ale ich nie publikuje.
  more:
    - ref: wieloetatowosc
    - ref: ustawa-o-danych-a-jawny-rejestr
  sources:
    - label: Ustawa z 19 czerwca 2026 r. (Dz.U. 2026 poz. 972), nowe brzmienie art. 27a ustawy o działalności leczniczej
      href: https://api.sejm.gov.pl/eli/acts/DU/2026/972/text.pdf
